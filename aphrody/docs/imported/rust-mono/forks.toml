# Source of truth for the forks this monorepo pins. One [[fork]] per submodule.
# path = <group>/<name>; name = repository name inside [meta].org (upstream name, or <owner>-<name> on a collision, see naming/NAMING.md).
# branch = tracked branch. default_branch only when the fork's default branch differs from it.
# rust_submodule / rust_subtree = where rust-lang/rust carries the same project (git submodule or josh subtree copy).
# policy: merge (default) merges upstream into a fork that carries commits and reports conflicts; ff-only never merges.

[meta]
org = "aphrody-labs"

[groups]
compiler = "rustc, the LLVM/GCC/Enzyme/TPDE backends it uses, miri and the alternative codegen backends"
devtools = "cargo, rustup, rust-analyzer, clippy, rustfmt, mdBook"
std = "standard library components and the foundational crates around it"
registry = "crates.io and docs.rs (the crates.io index is deliberately not forked)"
books = "reference, books and guides"
governance = "RFCs, teams, goals, forge, blog and newsletter"
infra = "rustc-perf, crater, bors, triagebot, simpleinfra"
wasm = "WebAssembly runtimes, tools and bindings"
consumers = "downstream projects that build with this toolchain"

[[not_forked]]
upstream = "rust-lang/crates.io-index"
reason = "427 MB of one-commit-per-publish history; the sparse index (index.crates.io) replaces it for every client and a fork would only mirror a registry cache"

[[fork]]
path = "compiler/rust"
name = "rust"
upstream = "rust-lang/rust"
branch = "main"
role = "compiler"

[[fork]]
path = "compiler/rust-lang-llvm-project"
name = "rust-lang-llvm-project"
upstream = "rust-lang/llvm-project"
branch = "rustc/23.1-2026-07-22"
role = "backend"
default_branch = "landing-page"
rust_submodule = "src/llvm-project"
note = "The LLVM that rust pins; llvm-project is the unmodified upstream. Track the rustc/* branch rust points at and move it when rust moves."

[[fork]]
path = "compiler/llvm-project"
name = "llvm-project"
upstream = "llvm/llvm-project"
branch = "main"
role = "backend"
note = "Upstream LLVM, for work that needs newer LLVM than the rustc/* branch (bun, zed, wasm toolchains)."

