# Aphrody Labs standard, machine-readable. Prose and rationale: STANDARD.md (same version).
# Consumers: the apply phase (gh api / wrangler), tools/lint-standard.ts, profile/generate.ts.
# Nothing here is a secret. Anything repository-specific is derived live (gh api, manifests), never listed here.

[meta]
version = "1.0.0"
date = "2026-11-17"
org = "aphrody-labs"
user = "aphrody-dev"
community_repo = "aphrody-labs/.github"
doc = "STANDARD.md"

# ---------------------------------------------------------------------------------------------
# Scope of the apply phase
# ---------------------------------------------------------------------------------------------
[scope]
# Repositories owned by another agent, protected, or preserved: the apply phase reads them and never writes.
skip_repos = [
  "aphrody-labs/aphrody",       # protected OS repository (also owns aphrody.com and aphrody.app)
  "aphrody-labs/ay",            # protected SDK and platform monorepo
  "aphrody-dev/ai-os",
  "aphrody-labs/nie",
  "aphrody-labs/open",
  "aphrody-labs/auto",
  "aphrody-labs/legacy",        # preserved archive, workflows disabled
  "rose-griffon/rosegriffon",
]
# Checkouts that other agents are editing, relative to WORKSPACE_ROOT (the directory holding the checkouts); "~/.claude" is the user's Claude config.
skip_paths = [
  "aphrody", "nie", "rosegriffon", "ai-os",
  "ay/packages/org-mirror", "~/.claude",
]
# Never change DNS records, zones or routes of these. Inventory only until the owner decides the roles.
frozen_domains = ["aphrody.com", "aphrody.app"]

# Classes are derived from the API, in this order: first match wins.
[classes]
private  = "visibility == private"
fork     = "fork == true"
original = "fork == false and archived == false"
archived = "archived == true"

# ---------------------------------------------------------------------------------------------
# Labels: one set for every original (forks keep upstream labels). Sync, never delete unknown labels automatically.
# ---------------------------------------------------------------------------------------------
[[labels]]
name = "bug"
color = "d73a4a"
description = "Something does not work as documented"

[[labels]]
name = "feature"
color = "0e8a16"
description = "New capability or behavior"

[[labels]]
name = "docs"
color = "0075ca"
description = "Documentation only"

[[labels]]
name = "chore"
color = "ededed"
description = "Maintenance, refactor, tooling, no behavior change"

[[labels]]
name = "security"
color = "b60205"
description = "Vulnerability or hardening; report privately first (SECURITY.md)"

[[labels]]
name = "question"
color = "d876e3"
description = "Usage question; prefer Discussions or SUPPORT.md"

[[labels]]
name = "needs-triage"
color = "fbca04"
description = "Not yet reviewed"

[[labels]]
name = "blocked"
color = "5319e7"
description = "Waiting on an external change"

[[labels]]
name = "duplicate"
color = "cfd3d7"
description = "Already tracked elsewhere"

[[labels]]
name = "wontfix"
color = "ffffff"
description = "Out of scope or declined"

[[labels]]
name = "good first issue"
color = "7057ff"
description = "Small, well specified, safe to start with"

[[labels]]
name = "help wanted"
color = "008672"
description = "Extra hands welcome"

[[labels]]
name = "p0"
color = "b60205"
description = "Production down or data loss"

[[labels]]
name = "p1"
color = "d93f0b"
description = "Major breakage, fix next"

[[labels]]
name = "p2"
color = "fbca04"
description = "Normal priority"

[[labels]]
name = "p3"
color = "c2e0c6"
description = "Low priority"

[[labels]]
name = "breaking"
color = "b60205"
description = "Breaking change; goes under Breaking in release notes"

[[labels]]
name = "skip-changelog"
color = "ededed"
description = "Excluded from generated release notes"

# Dependabot labels (referenced by templates/dependabot.yml).
[[labels]]
name = "dependencies"
color = "0366d6"
description = "Dependency update"

[[labels]]
name = "github_actions"
color = "000000"
description = "Workflow action update"

[[labels]]
name = "bun"
color = "f9f1e1"
description = "Bun or npm dependency update"

[[labels]]
name = "rust"
color = "dea584"
description = "Cargo dependency update"

# Labels GitHub creates by default that the standard replaces.
[labels_rename]
enhancement = "feature"
documentation = "docs"
invalid = "wontfix"

# ---------------------------------------------------------------------------------------------
# Files
# ---------------------------------------------------------------------------------------------
[files]
# Served by the org fallback (aphrody-labs/.github) when a repository has none of its own.
org_fallback = [
  "CONTRIBUTING.md", "SECURITY.md", "CODE_OF_CONDUCT.md", "SUPPORT.md",
  ".github/ISSUE_TEMPLATE/bug.yml", ".github/ISSUE_TEMPLATE/feature.yml",
  ".github/ISSUE_TEMPLATE/docs.yml", ".github/ISSUE_TEMPLATE/crash.yml", ".github/ISSUE_TEMPLATE/config.yml",
  ".github/pull_request_template.md",
]
# Required in every original (copy from templates/ when missing). Not inherited by GitHub.
original_required = [
  "README.md", "LICENSE", ".github/CODEOWNERS", ".github/dependabot.yml", ".github/workflows/ci.yml",
  ".editorconfig", ".gitattributes", ".gitignore",
]
# Required when the repository publishes a package, a release or a site.
published_required = [".github/release.yml", ".github/workflows/release.yml"]
# Recommended (lint warns).
original_recommended = ["AGENTS.md", "docs/index.md", "CHANGELOG.md", ".markdownlint-cli2.jsonc", ".gitmessage", "REVIEW.md"]
# Never committed.
forbidden = [".env", ".env.*", "*.pem", "*.p12", "*.pfx", "id_rsa", "id_ed25519", "*.sqlite-wal", ".dev.vars"]
# A repository-level .github/ISSUE_TEMPLATE replaces the whole org set: keep the same five file names or none.
issue_templates_all_or_nothing = true
readme_language = "en"
default_license = "Apache-2.0"
license_exceptions = "forks and mirrors keep the upstream license untouched"

# Files copied from templates/ (never inherited). "when" is a manifest that must exist at the repository root; "mode" is copy (whole file)
# or merge (sections copied into an existing file by hand). The apply phase only reports a missing copy (stepNeeds); it never overwrites.
[[files.templates]]
source = "templates/gitmessage"
dest = ".gitmessage"
mode = "copy"
note = "git config commit.template .gitmessage"

[[files.templates]]
source = "templates/REVIEW.md"
dest = "REVIEW.md"
mode = "copy"

[[files.templates]]
source = "templates/rustfmt.toml"
dest = "rustfmt.toml"
when = "Cargo.toml"
mode = "copy"

[[files.templates]]
source = "templates/rustfmt.browser.toml"
dest = "rustfmt.toml"
when = "Cargo.toml"
mode = "merge"
note = "browser-facing crates on a pinned nightly only"

[[files.templates]]
source = "templates/clippy.toml"
dest = "clippy.toml"
when = "Cargo.toml"
mode = "copy"

[[files.templates]]
source = "templates/rust-lints.toml"
dest = "Cargo.toml"
when = "Cargo.toml"
mode = "merge"
note = "[workspace.lints.*] tables, then [lints] workspace = true in each member"

[[files.templates]]
source = "templates/bunfig.standard.toml"
dest = "bunfig.toml"
when = "package.json"
mode = "merge"
note = "[fmt] and [lint] sections"

[code_style]
# docs/standards/code-style.md and its machine-readable parts. tools/check-commit.ts reads these keys and naming.commit_types.
doc = "docs/standards/code-style.md"
sources = "docs/standards/sources.toml"
conflicts = "docs/standards/conflicts.md"
commit_style = "area"           # default of tools/check-commit.ts (CO-01, C-15); "conventional" is the accepted alternative
commit_subject_max = 72
commit_body_wrap = 72          # hard-wrap target for direct commits (CO-12)
commit_body_max = 100          # the checker warns above this; tables, code and long URLs are exempt
pr_title_is_squash_subject = true
bun_fmt_print_width = 100
rustfmt_max_width = 100        # the rustfmt default; documented here so it is not set per repository

[readme]
required_sections = ["Install", "Usage", "Development", "License"]
max_title_chars = 60
badge_row_max = 5
require_description_line = true

[docs]
format = "markdown"            # README, CONTRIBUTING, SECURITY and the like stay plain GitHub-flavored Markdown
site_format = "mdx"            # docs/**/*.mdx for published sites
mdx_frontmatter_required = ["title", "description"]
mdx_compiler = "@mdx-js/mdx"
lint = ["markdownlint-cli2", "lychee", "mdx-compile"]

# ---------------------------------------------------------------------------------------------
# Naming
# ---------------------------------------------------------------------------------------------
[naming]
repo = "^[a-z0-9][a-z0-9._-]*$"       # lowercase kebab for originals; forks keep the upstream name
repo_max = 50
branch_default = "main"
tag = "^v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$"
commit = "area"                       # area: summary (Bun's shape), imperative, no AI attribution trailers; "type(scope): summary" is accepted
commit_styles = ["area", "conventional"]   # accepted by tools/check-commit.ts; naming.commit is the default
commit_types = ["feat", "fix", "docs", "chore", "refactor", "perf", "test", "build", "ci", "revert"]
topics = ["lowercase", "kebab", "max 20 per repo", "role topic required: aphrody-<role>"]
role_topics = ["aphrody-runtime", "aphrody-craft", "aphrody-games", "aphrody-unix", "aphrody-platform", "aphrody-design", "aphrody-tools"]

# ---------------------------------------------------------------------------------------------
# Repository settings (originals unless a section says fork)
# ---------------------------------------------------------------------------------------------
[repo_settings.original]
has_issues = true
has_projects = false
has_wiki = false
has_discussions = false              # enable per repository with an outside audience (see discussions.enable_on)
delete_branch_on_merge = true
allow_auto_merge = true
allow_update_branch = true
allow_squash_merge = true
allow_rebase_merge = true
allow_merge_commit = false
squash_merge_commit_title = "PR_TITLE"
squash_merge_commit_message = "PR_BODY"
web_commit_signoff_required = false
description_required = true
homepage_required = true
topics_required = true

[repo_settings.fork]
has_issues = false
has_projects = false
has_wiki = false
has_discussions = false
delete_branch_on_merge = false
description_prefix_required = false
# Inherited upstream workflows are disabled unless a workflow of the fork is the reason for the fork.
actions_enabled = false

[repo_settings.private]
has_wiki = false
has_projects = false

[discussions]
categories = ["Announcements", "Q&A", "Ideas", "Show and tell"]
enable_on = ["aphrody-labs/ay", "aphrody-labs/aphrody-m3", "aphrody-labs/browser"]

[pages]
source = "workflow"                  # build_type = workflow; never a gh-pages or docs/ branch source
enabled_only_when = "the repository has a docs or site build and a reusable pages.yml caller"
https_enforced = true

[wiki]
enabled = false
note = "docs live in the repository (docs/*.md or *.mdx), reviewed like code"

# ---------------------------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------------------------
[security.originals_public]
secret_scanning = true
secret_scanning_push_protection = true
dependabot_alerts = true
dependabot_security_updates = true
dependency_graph = true
code_scanning_default_setup = "configured"
code_scanning_query_suite = "default"
private_vulnerability_reporting = true

[security.originals_private]
dependabot_alerts = true
dependabot_security_updates = true
dependency_graph = true
# Secret scanning, push protection and CodeQL need GitHub Advanced Security on private repositories (not on the free plan).
secret_scanning = "unavailable"

[security.forks]
secret_scanning = true
secret_scanning_push_protection = true
dependabot_alerts = true
dependabot_security_updates = false
dependency_graph = true
code_scanning_default_setup = "not_set"   # huge upstream trees; scan the upstream, not the mirror

# Originals made mostly of vendored upstream trees (aggregated monorepos). Dependabot cannot update a vendored manifest
# (exclude-paths covers version updates only), so its security-update runs fail there: these repositories take the
# forks profile and configuration (alerts on, security updates off). Extend by topic: aphrody-vendored.
[security.vendored]
repos = ["aphrody-labs/browser"]
topic = "aphrody-vendored"

# Org security configurations (POST /orgs/{org}/code-security/configurations, then attach). id 17 "GitHub recommended" stays untouched.
[security.configurations.originals]
name = "aphrody-originals"
description = "Public originals: secret scanning, push protection, Dependabot, CodeQL default setup, private vulnerability reporting"
advanced_security = "enabled"
dependency_graph = "enabled"
dependabot_alerts = "enabled"
dependabot_security_updates = "enabled"
code_scanning_default_setup = "enabled"
secret_scanning = "enabled"
secret_scanning_push_protection = "enabled"
secret_scanning_non_provider_patterns = "disabled"   # accepted by the API but stays disabled on the free plan (verified 2026-11-17)
secret_scanning_validity_checks = "disabled"       # same
private_vulnerability_reporting = "enabled"
enforcement = "enforced"
attach_scope = "selected"            # the apply phase passes the repository ids of public originals

[security.configurations.forks]
name = "aphrody-forks"
description = "Forks and mirrors: secret scanning, push protection, Dependabot alerts; no CodeQL"
advanced_security = "enabled"
dependency_graph = "enabled"
dependabot_alerts = "enabled"
dependabot_security_updates = "disabled"
code_scanning_default_setup = "not_set"
secret_scanning = "enabled"
secret_scanning_push_protection = "enabled"
private_vulnerability_reporting = "disabled"
enforcement = "unenforced"
attach_scope = "public"
default_for_new_repos = "public"     # PUT .../defaults; originals are promoted to aphrody-originals after creation

[security.org]
two_factor_required = true
default_repository_permission = "read"
members_can_create_repositories = false
members_can_create_public_repositories = false
members_can_fork_private_repositories = false
web_commit_signoff_required = false
pending_invitations = "revoke unless the owner confirms the invitee in the same session"
admins_max = 2

# ---------------------------------------------------------------------------------------------
# Actions (org level, PUT /orgs/{org}/actions/permissions and .../workflow)
# ---------------------------------------------------------------------------------------------
[actions.org]
default_workflow_permissions = "read"
can_approve_pull_request_reviews = false
enabled_repositories = "all"
allowed_actions = "selected"
github_owned_allowed = true
verified_allowed = false
# Union of: this list and every third-party action found in workflows of non-fork originals (derived by the apply phase).
patterns_allowed = [
  "aphrody-labs/*", "aphrody-dev/*",
  "oven-sh/setup-bun@*", "dtolnay/rust-toolchain@*", "Swatinem/rust-cache@*", "rust-lang/crates-io-auth-action@*",
  "KyleMayes/install-llvm-action@*", "golangci/golangci-lint-action@*", "cloudflare/wrangler-action@*",
  "DavidAnson/markdownlint-cli2-action@*", "lycheeverse/lychee-action@*", "ossf/scorecard-action@*",
]
sha_pinning_required = false           # inherited fork workflows are unpinned; originals are linted instead (lint.pinned_actions)
fork_pr_workflows_need_approval = "all_external_contributors"

[actions.conventions]
pin_third_party_to_sha = true
sha_comment_required = true            # "# v7.0.1" after every pinned sha
first_party_ref = "main"               # aphrody-labs/.github reusable workflows are referenced by @main
top_level_permissions = { contents = "read" }
grant_per_job = true
concurrency_group = "${{ github.workflow }}-${{ github.ref }}"
cancel_in_progress_on_pr = true
cancel_in_progress_on_main = false
timeout_minutes_default = 30
runner_default = "ubuntu-latest"
heavy_builds = "fr1 (self-hosted label) or never on the PC"
persist_credentials = false
no_pull_request_target_checkout = true
untrusted_input_in_run = "forbidden: pass github.event.* through env"

[actions.pinned_versions]
# Resolved live on 2026-11-17 with gh api; refreshed by Dependabot (github-actions ecosystem).
"actions/checkout" = { sha = "3d3c42e5aac5ba805825da76410c181273ba90b1", tag = "v7.0.1" }
"oven-sh/setup-bun" = { sha = "0c5077e51419868618aeaa5fe8019c62421857d6", tag = "v2.2.0" }
"dtolnay/rust-toolchain" = { sha = "683b588c487a69d01f6c6ddf40f036ff682cc2c8", tag = "v1" }
"Swatinem/rust-cache" = { sha = "d1527c8f67ef9af357290475d4af4b0fab8f12e0", tag = "v2.9.3" }
"actions/setup-go" = { sha = "b7ad1dad31e06c5925ef5d2fc7ad053ef454303e", tag = "v7.0.0" }
"actions/setup-node" = { sha = "949feb2413d6458794dcd2491c4babbbce0c15c1", tag = "v7.1.0" }
"actions/cache" = { sha = "55cc8345863c7cc4c66a329aec7e433d2d1c52a9", tag = "v6.1.0" }
"actions/upload-artifact" = { sha = "cf430e030ddbb5b0abf93d22962f4752f3646cd9", tag = "v7.0.2" }
"actions/download-artifact" = { sha = "9000827ccba6bdab643e8b6fd33ac0654aef8333", tag = "v8.0.2" }
"actions/configure-pages" = { sha = "45bfe0192ca1faeb007ade9deae92b16b8254a0d", tag = "v6.0.0" }
"actions/upload-pages-artifact" = { sha = "fc324d3547104276b827a68afc52ff2a11cc49c9", tag = "v5.0.0" }
"actions/deploy-pages" = { sha = "368f82528645a54fb793d4d04e342629a3f51346", tag = "v5.0.1" }
"actions/dependency-review-action" = { sha = "a1d282b36b6f3519aa1f3fc636f609c47dddb294", tag = "v5.0.0" }
"actions/attest-build-provenance" = { sha = "4d101475d8b20a2381f78447822ac1eab6504dd8", tag = "v4.2.2" }
"actions/stale" = { sha = "4391f3da665fdf50b6810c1a66712fb9ba21aa93", tag = "v11.0.0" }
"github/codeql-action" = { sha = "33d7b85da1a04171e211befe2c739303b9a4c066", tag = "v4.39.3" }
"rust-lang/crates-io-auth-action" = { sha = "3268eb413133e2960fa4ae0e963ca76380c54cd9", tag = "v1.0.6" }
"cloudflare/wrangler-action" = { sha = "953926a2e2182532811c01a25e53647d93bf07c0", tag = "v4.1.3" }
"ossf/scorecard-action" = { sha = "fa7117db83c52d787ae5a89f350999701505d78e", tag = "v2.5.0" }
"golangci/golangci-lint-action" = { sha = "ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a", tag = "v9.3.0" }
"KyleMayes/install-llvm-action" = { sha = "ebc0426251bc40c7cd31162802432c68818ab8f0", tag = "v2.0.9" }
"lycheeverse/lychee-action" = { sha = "e7477775783ea5526144ba13e8db5eec57747ce8", tag = "v2.9.0" }
"DavidAnson/markdownlint-cli2-action" = { sha = "696eb3f2509270d7b882d2aa68347bc676e7af34", tag = "v25.0.0" }

[actions.reusable]
# Called as aphrody-labs/.github/.github/workflows/<file>@main; every one ends in a job named "gate".
ci_bun = "ci-bun.yml"
ci_rust = "ci-rust.yml"
ci_c_llvm = "ci-c-llvm.yml"
ci_go = "ci-go.yml"
docs = "docs.yml"
pages = "pages.yml"
release = "release.yml"
publish_npm = "publish-npm.yml"
publish_crates = "publish-crates.yml"
required_check = "ci / gate"           # caller job id "ci" + reusable job "gate"

[lint]
pinned_actions = "error"               # tools/lint-standard.ts: third-party uses: must be a 40-hex sha, except aphrody-labs/* and aphrody-dev/*
permissions_declared = "error"
timeout_declared = "warn"
checkout_persist_credentials_false = "warn"

# ---------------------------------------------------------------------------------------------
# Dependabot
# ---------------------------------------------------------------------------------------------
[dependabot]
file = ".github/dependabot.yml"
version = 2
interval = "weekly"
day = "monday"
open_pull_requests_limit = 5
grouped_updates = true
groups = ["minor-and-patch (applies-to version-updates, update-types minor and patch)", "security (applies-to security-updates)"]
cooldown_default_days = 3             # new releases wait 3 days (supply-chain guard); majors 7
cooldown_major_days = 7
exclude_paths = ["third_party/**", "vendor/**", "vendored/**", "upstream/**", "fixtures/**", "testdata/**"]
labels = ["dependencies"]
ecosystems = ["bun", "cargo", "gomod", "github-actions", "gitsubmodule", "docker", "nuget", "uv"]
detect = "one updates entry per manifest directory found by the apply phase; github-actions always"

# ---------------------------------------------------------------------------------------------
# Rulesets (POST /repos/{owner}/{repo}/rulesets). Solo-maintainer autonomous setup: agents commit to main directly,
# so integrity rules block rewrites for everyone and gating rules (PR, required checks) apply with an admin bypass.
# ---------------------------------------------------------------------------------------------
[rulesets]
tiers = { solo = ["main-integrity", "tags-immutable"], gated = ["main-integrity", "tags-immutable", "main-gated"] }
default_tier = "solo"
# Repositories that start in the gated tier (published packages, production deploys, outside contributors). Extend by topic: aphrody-gated.
gated_repos = ["aphrody-labs/ay", "aphrody-labs/aphrody-m3", "aphrody-labs/browser", "aphrody-labs/r2b"]
gated_topic = "aphrody-gated"
forks = "none"
# Org rulesets and merge queue availability depend on plan: the apply phase tries, records the HTTP status, and falls back.
org_rulesets_available = false
merge_queue = "optional: add the merge_queue rule to main-gated only when the API accepts it; callers then also trigger on merge_group"

[rulesets.main-integrity]
description = "No deletion, no force push, linear history on the default branch. No bypass: nobody rewrites main."
body = '''
{
  "name": "main-integrity",
  "target": "branch",
  "enforcement": "active",
  "bypass_actors": [],
  "conditions": { "ref_name": { "include": ["~DEFAULT_BRANCH"], "exclude": [] } },
  "rules": [
    { "type": "deletion" },
    { "type": "non_fast_forward" },
    { "type": "required_linear_history" }
  ]
}
'''

[rulesets.main-gated]
description = "Pull request flow and a required check for gated repositories. Repository admins (the owner and its agents) bypass, others cannot push to main."
body = '''
{
  "name": "main-gated",
  "target": "branch",
  "enforcement": "active",
  "bypass_actors": [
    { "actor_id": 5, "actor_type": "RepositoryRole", "bypass_mode": "always" }
  ],
  "conditions": { "ref_name": { "include": ["~DEFAULT_BRANCH"], "exclude": [] } },
  "rules": [
    {
      "type": "pull_request",
      "parameters": {
        "required_approving_review_count": 0,
        "dismiss_stale_reviews_on_push": false,
        "require_code_owner_review": false,
        "require_last_push_approval": false,
        "required_review_thread_resolution": true,
        "allowed_merge_methods": ["squash", "rebase"]
      }
    },
    {
      "type": "required_status_checks",
      "parameters": {
        "strict_required_status_checks_policy": false,
        "do_not_enforce_on_create": true,
        "required_status_checks": [ { "context": "ci / gate" } ]
      }
    }
  ]
}
'''

[rulesets.tags-immutable]
description = "Release tags v* cannot be moved or deleted. To fix a bad tag, disable the ruleset, correct, enable again (recorded in the commit log)."
body = '''
{
  "name": "tags-immutable",
  "target": "tag",
  "enforcement": "active",
  "bypass_actors": [],
  "conditions": { "ref_name": { "include": ["refs/tags/v*"], "exclude": [] } },
  "rules": [
    { "type": "deletion" },
    { "type": "update" },
    { "type": "non_fast_forward" }
  ]
}
'''

# ---------------------------------------------------------------------------------------------
# Releases and publishing
# ---------------------------------------------------------------------------------------------
[release]
trigger = "push of a tag matching naming.tag"
versioning = "semver"
notes = "gh release create --generate-notes with .github/release.yml categories"
changelog = "GitHub Releases are the changelog; CHANGELOG.md only when a package ships to users outside GitHub"
attestations = "actions/attest-build-provenance for release artifacts"
release_categories = [
  { title = "Breaking", labels = ["breaking"] },
  { title = "Features", labels = ["feature"] },
  { title = "Fixes", labels = ["bug", "security"] },
  { title = "Documentation", labels = ["docs"] },
  { title = "Maintenance", labels = ["chore", "dependencies", "github_actions", "bun", "rust"] },
]
release_exclude_labels = ["skip-changelog"]

[publishing.npm]
auth = "trusted publishing (OIDC): no NPM_TOKEN in originals"
registry = "https://registry.npmjs.org"
min_npm = "11.5.1"
min_node = "22.14.0"
permissions = { contents = "read", id-token = "write" }
trusted_publisher_workflow_filename = "release.yml"   # the caller, not the reusable workflow
provenance = "automatic for public repository and public package"
runners = "github-hosted only"
first_publish_window_days = 2
tokens_fallback = "granular token with expiry, environment-scoped secret, only until the trusted publisher is configured"

[publishing.crates]
auth = "trusted publishing (OIDC) via rust-lang/crates-io-auth-action; token lives 30 minutes"
permissions = { contents = "read", id-token = "write" }
trusted_publisher_workflow_filename = "release.yml"
environment = "release"
first_publish = "manual with an API token (the crate must exist before a trusted publisher can be configured)"

[publishing.other]
go = "git tag only; the Go module proxy serves tags"
c_llvm = "release assets uploaded by the release workflow with attestations"
containers = "ghcr.io with GITHUB_TOKEN (packages: write on the job only)"

# ---------------------------------------------------------------------------------------------
# Org apps, OAuth, secrets
# ---------------------------------------------------------------------------------------------
[apps]
repository_selection = "selected"      # never "all" except the org's own app
review_interval_days = 90
administration_permission_allowed = ["aphrody-labs"]   # the org's own app only
remove_when = "no event, check run or commit from the app in 90 days"
prefer = "GitHub App installation tokens over personal access tokens"
pat = "fine-grained, expiry <= 90 days, single repository set"
oauth_app_access_restrictions = "enabled (organization settings, Third-party access): approve per app"
installed_review = ["claude", "chatgpt-codex-connector", "cursor", "neon-postgres", "aphrody-labs", "better-i18n", "figma"]

[secrets]
org_visibility = "selected"
names_allowed_org = ["APHRODY_APP_KEY", "SUBMODULES_APP_KEY"]
move_to_selected = ["NPM_TOKEN", "CARGO_REGISTRY_TOKEN", "HOSTINGER_API_TOKEN"]
replace_with_oidc = ["NPM_TOKEN", "CARGO_REGISTRY_TOKEN"]
environment_scoped = ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID"]
never_in_repo = true
rotate_days = 90

# ---------------------------------------------------------------------------------------------
# Cloudflare policy (account has no KV, D1, Pages or Hyperdrive today; keep it that way unless a purpose needs one)
# ---------------------------------------------------------------------------------------------
[cloudflare]
one_resource_per_purpose = true
naming = "<product>-<purpose>[-<env>], lowercase kebab, product = aphrody | shenron | rosegriffon | ..., env only when more than one exists"
config_in_repo = "wrangler.jsonc next to the code; dashboard changes are drift"
workers = "edge compute and routing only; one Worker per purpose, parameterized by vars and env, not copied per hostname"
r2 = "static assets, release artifacts, backups and large objects; one bucket per purpose and retention class"
hostnames = "a hostname is served by exactly one of: R2 custom domain (static) or Worker route/custom domain (dynamic)"
workers_dev = "disabled once a custom domain serves the Worker"
public_r2_dev = "disabled; public access only through a custom domain"
tunnels = "one tunnel per host group; ingress rules must have a DNS record or be removed"
access = "one Access application per hostname, policies named <purpose>-<audience>; migration leftovers deleted after the owner confirms"
tokens = "account-owned, scoped to one purpose, expiry <= 90 days, name <system>-<purpose>-<yyyy-mm>; unused 30 days means revoke; no non-expiring token"
deletion_rule = "delete only a resource proven duplicate or orphaned (no route, no binding, no traffic in 30 days); record id, name and reason in the commit or ledger entry that deletes it; prefer archive or disable first"
analytics_check_days = 30
dns_frozen = ["aphrody.com", "aphrody.app"]
dns_note = "inventory only: zones, records, routes and custom domains of these two stay unchanged until the owner decides domain roles"
ci_auth = "API token in a GitHub environment secret (Cloudflare has no GitHub OIDC for wrangler); deploy job: contents read only"
cost_tracking = "R2 over 10 GB, Workers paid plan and any new resource go in the budget ledger"
deploy_action = "cloudflare/wrangler-action (pinned)"

# ---------------------------------------------------------------------------------------------
# Org profile generator (profile/generate.ts). Roles are matched in order; first match wins.
# A repository may override with the topic aphrody-<role>.
# ---------------------------------------------------------------------------------------------
[profile]
output = "profile/README.md"
owners = ["aphrody-labs"]
include_private = false
include_archived = false
sort = "stars desc, pushed desc, name"
fork_listing = "collapsed <details> per family, names only"
heading = "Aphrody Labs"
tagline = "An OS, a browser, a Google and a Cloudflare/Vercel, crafted in any language."

[[profile.roles]]
id = "runtime"
title = "Runtime and platform"
blurb = "The SDK, the runtime, the browser, the AI OS and the services around them."
repos = [
  "aphrody-labs/ay", "aphrody-labs/aphrody", "aphrody-labs/browser", "aphrody-labs/aphrody-git",
  "aphrody-dev/ay-cf", "aphrody-dev/ay-media", "aphrody-labs/aynt",
