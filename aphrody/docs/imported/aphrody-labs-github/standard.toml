# ---------------------------------------------------------------------------------------------
# Archiving (tools/apply.ts, step archive). Archive is reversible (PATCH archived=false); nothing is deleted.
# ---------------------------------------------------------------------------------------------
[archive]
dead_days = 30                        # no push for this long, no stars, forks, issues or pull requests, no submodule reference
duplicate_rule = "forks of one upstream in the same owner set: archive the copy that has no commit the keeper lacks (identical or strict subset); keeper = referenced as a submodule, then named like the upstream, then most recently pushed"
