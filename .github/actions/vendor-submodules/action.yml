name: Checkout vendored path-dependency submodules
description: Initialise only the submodules that a Cargo manifest references through a `path = "<submodule>"` dependency.

runs:
  using: composite
  steps:
    - name: Initialise referenced submodules
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -f .gitmodules ] || ! grep -q '\[submodule' .gitmodules; then
          echo "Zero blocking vendor submodules — forks are resolved via pinned aphrody-labs/* GitHub Release tags."
          exit 0
        fi
        manifests=$(find . -name Cargo.toml -not -path './vendor/*' -not -path '*/target/*' -not -path './.git/*')
        paths=$(git config -f .gitmodules --get-regexp '\.path$' | awk '{print $2}' | while read -r p; do
          if echo "$manifests" | xargs grep -lE "path *= *\"$p[/\"]" > /dev/null 2>&1; then echo "$p"; fi
        done)
        echo "Submodules referenced by path dependencies:"
        echo "$paths"
        git config --global core.longpaths true
        git config --global submodule.fetchJobs 8
        [ -z "$paths" ] || echo "$paths" | xargs git submodule update --init --depth 1 --jobs 8 --
        for sub in $paths; do
          if [ -f "$sub/.gitmodules" ]; then
            nested_manifests=$(find "$sub" -name Cargo.toml -not -path '*/target/*' -not -path '*/.git/*')
            nested_paths=$(git config -f "$sub/.gitmodules" --get-regexp '\.path$' | awk '{print $2}' | while read -r np; do
              if [ -n "$nested_manifests" ] && echo "$nested_manifests" | xargs grep -lE "path *= *\"(\.\./|\./)*$np[/\"]" > /dev/null 2>&1; then
                echo "$np"
              fi
            done)
            if [ -n "$nested_paths" ]; then
              echo "Nested Cargo submodules in $sub: $nested_paths"
              echo "$nested_paths" | xargs git -C "$sub" submodule update --init --depth 1 --jobs 8 --
            fi
          fi
        done
