name: aphrody CI

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]
  merge_group: {}
  workflow_dispatch:

concurrency:
  group: aphrody-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: '0'

permissions:
  contents: read

jobs:
  plugin-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: oven-sh/setup-bun@v2
      - name: Validate product manifest, plugin manifests, workflow YAML, and Bun hooks
        run: |
          bun -e '
            import { Glob } from "bun";
            import { readFileSync } from "node:fs";
            const product = Bun.TOML.parse(readFileSync("product.toml", "utf8")) as {
              plugin: { name: string };
            };
            const pluginDir = `.agents/plugins/${product.plugin.name}`;
            for (const f of [
              ".agents/plugins.json",
              `${pluginDir}/plugin.json`,
              `${pluginDir}/hooks.json`,
              ".github/renovate.json",
            ]) {
              JSON.parse(readFileSync(f, "utf8"));
            }
            for (const y of [
              ...new Glob(".github/workflows/*.yml").scanSync("."),
              ...new Glob(".github/ISSUE_TEMPLATE/*.yml").scanSync("."),
              ...new Glob(".github/DISCUSSION_TEMPLATE/*.yml").scanSync("."),
            ]) {
              Bun.YAML.parse(readFileSync(y, "utf8"));
            }
            console.log(`PLUGIN_DIR=${pluginDir}`);
          ' > cfg.env
          PLUGIN_DIR=$(cut -d= -f2 cfg.env)
          rm -f cfg.env
          cd "$PLUGIN_DIR"
          echo '{"cwd":"'"$GITHUB_WORKSPACE"'"}' | bun ./hooks/session-start.ts
          echo '{"toolCall":{"name":"write_file","args":{"Path":"crates/example/src/lib.rs"}}}' | bun ./hooks/post-edit-check.ts

  brand-and-sdk-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: ./.github/actions/vendor-submodules
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config clang libclang-dev lld \
            libasound2-dev libfontconfig-dev libfreetype-dev libgit2-dev libglib2.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev libsoup-3.0-dev libsqlite3-dev libssl-dev libva-dev \
            libvulkan1 libwayland-dev libwebkit2gtk-4.1-dev \
            libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev
      - uses: oven-sh/setup-bun@v2
      - name: Read toolchain and workspace config via Bun
        id: cfg
        shell: bash
        run: |
          bun -e '
            import { readFileSync } from "node:fs";
            const rt = Bun.TOML.parse(readFileSync("rust-toolchain.toml", "utf8")) as any;
            const pm = Bun.TOML.parse(readFileSync("product.toml", "utf8")) as any;
            const feat = pm.features;
            const lines = [
              `toolchain=${rt.toolchain.channel}`,
              `app_bin=${pm.product.slug}`,
              `app_features=${feat.default_app_features.join(",")}`,
              `ui_crate=${feat.modular_ui_crate}`,
              `ui_features=${feat.modular_ui_features}`,
              `code_crate=${feat.modular_code_crate}`,
              `shell_crate=${feat.modular_shell_crate}`,
              `shell_features=${feat.modular_shell_features}`,
              `wgpu_pkg=${feat.wgpu_cli_package}`,
            ];
            for (const l of lines) console.log(l);
          ' >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.cfg.outputs.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Brand manifest & icon consistency check
        run: |
          cargo xtask brand check
          cargo test -j 4 -p brand
          cargo test -j 4 -p xtask --bins
      - name: Modular GPUI & WGPU SDK checks
        run: |
          cargo check -j 4 -p "${{ steps.cfg.outputs.ui_crate }}" --features "${{ steps.cfg.outputs.ui_features }}"
          cargo check -j 4 -p "${{ steps.cfg.outputs.code_crate }}" --no-default-features
          cargo check -j 4 -p "${{ steps.cfg.outputs.shell_crate }}" --features "${{ steps.cfg.outputs.shell_features }}"
          cargo test -j 4 -p "${{ steps.cfg.outputs.wgpu_pkg }}" --bins
          cargo check -j 4 -p "${{ steps.cfg.outputs.wgpu_pkg }}" --examples

  windows-aphrody-and-gpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: ./.github/actions/vendor-submodules
      - uses: oven-sh/setup-bun@v2
      - name: Read toolchain and workspace config via Bun
        id: cfg
        shell: bash
        run: |
          bun -e '
            import { readFileSync } from "node:fs";
            const rt = Bun.TOML.parse(readFileSync("rust-toolchain.toml", "utf8")) as any;
            const pm = Bun.TOML.parse(readFileSync("product.toml", "utf8")) as any;
            const feat = pm.features;
            const lines = [
              `toolchain=${rt.toolchain.channel}`,
              `app_bin=${pm.product.slug}`,
              `app_features=${feat.default_app_features.join(",")}`,
              `wgpu_pkg=${feat.wgpu_cli_package}`,
            ];
            for (const l of lines) console.log(l);
          ' >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.cfg.outputs.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Brand check & Windows compilation
        shell: bash
        run: |
          cargo xtask brand check
          cargo test -j 4 -p brand
          cargo test -j 4 -p "${{ steps.cfg.outputs.wgpu_pkg }}" --bins
          cargo check -j 4 -p "${{ steps.cfg.outputs.wgpu_pkg }}" --examples
          cargo check -j 4 -p zed --bin "${{ steps.cfg.outputs.app_bin }}" --features "${{ steps.cfg.outputs.app_features }}"
          cargo check -j 4 -p cli --bin cli
