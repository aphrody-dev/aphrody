name: gpui-os CI

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]
  merge_group: {}
  workflow_dispatch:

concurrency:
  group: gpui-os-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: '0'

permissions:
  contents: read

jobs:
  plugin-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: oven-sh/setup-bun@v2
      - name: Validate plugin manifests, workflow YAML, and Bun hooks
        run: |
          bun -e '
            import { Glob } from "bun";
            import { readFileSync } from "node:fs";
            for (const f of [
              ".agents/plugins.json",
              ".agents/plugins/gpui-os/plugin.json",
              ".agents/plugins/gpui-os/hooks.json",
              ".github/renovate.json",
            ]) {
              JSON.parse(readFileSync(f, "utf8"));
            }
            for (const y of [
              ...new Glob(".github/workflows/*.yml").scanSync("."),
              ...new Glob(".github/ISSUE_TEMPLATE/*.yml").scanSync("."),
            ]) {
              Bun.YAML.parse(readFileSync(y, "utf8"));
            }
          '
          cd .agents/plugins/gpui-os
          echo '{"cwd":"'"$GITHUB_WORKSPACE"'"}' | bun ./hooks/session-start.ts
          echo '{"toolCall":{"name":"run_command","args":{"CommandLine":"cargo xtask brand check"}}}' | bun ./hooks/pre-tool-guard.ts
          echo '{"toolCall":{"name":"write_file","args":{"Path":"crates/example/src/lib.rs"}}}' | bun ./hooks/post-edit-check.ts

  brand-and-sdk-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config clang libclang-dev lld \
            libasound2-dev libfontconfig-dev libfreetype-dev libgit2-dev libglib2.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev libsoup-3.0-dev libsqlite3-dev libssl-dev libva-dev \
            libvulkan1 libwayland-dev libwebkit2gtk-4.1-dev \
            libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev
      - name: Read toolchain from rust-toolchain.toml
        id: rt
        shell: bash
        run: echo "toolchain=$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rt.outputs.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Brand manifest & icon consistency check
        run: |
          cargo xtask brand check
          cargo test -j 4 -p brand -p xtask --bins
      - name: Modular GPUI & WGPU SDK checks
        run: |
          cargo check -j 4 -p gpui_ui --features nsh-full
          cargo check -j 4 -p gpui_code --no-default-features
          cargo check -j 4 -p gpui_app_shell --features nsh
          cargo test -j 4 -p wgpu_cli --lib
          cargo check -j 4 -p wgpu_cli --examples

  windows-aphrody-and-gpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Read toolchain from rust-toolchain.toml
        id: rt
        shell: bash
        run: echo "toolchain=$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rt.outputs.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Brand check & Windows compilation
        shell: bash
        run: |
          cargo xtask brand check
          cargo test -j 4 -p brand
          cargo test -j 4 -p wgpu_cli --lib
          cargo check -j 4 -p wgpu_cli --examples
          cargo check -j 4 -p zed --bin aphrody --features full
          cargo check -j 4 -p cli --bin cli
