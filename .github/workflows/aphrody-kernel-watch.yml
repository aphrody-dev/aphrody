name: aphrody-kernel-watch

# Polls the kernel sources of tooling/kernel-watch/sources.toml, regenerates docs/watch and commits only when the output changed.
# GitHub cron runs at best every 5 minutes and starts late under load, so "real time" here is minutes, not seconds.
on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - tooling/kernel-watch/**
      - .github/workflows/aphrody-kernel-watch.yml
  workflow_dispatch:
    inputs:
      force:
        description: Ignore per-source intervals and poll every source
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun tooling/kernel-watch/cli.ts validate
      - run: bun test tooling/kernel-watch

  watch:
    if: github.event_name != 'push' && !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Restore the store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tooling/kernel-watch/.store
          key: kernel-watch-store-${{ github.run_id }}
          restore-keys: kernel-watch-store-
      - name: Validate the manifest
        run: bun tooling/kernel-watch/cli.ts validate
      - name: Poll
        run: bun tooling/kernel-watch/cli.ts poll --budget 240 ${{ env.FORCE == 'true' && '--force' || '' }}
      - name: Save the store
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tooling/kernel-watch/.store
          key: kernel-watch-store-${{ github.run_id }}
      - name: Regenerate docs/watch
        run: bun tooling/kernel-watch/cli.ts build
      - name: Commit when the output changed
        run: |
          if [ "$(bun tooling/kernel-watch/cli.ts gate --slow-minutes 360)" != "commit" ]; then
            echo "nothing worth a commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/watch
          git commit -m "chore(watch): refresh kernel watch data" -- docs/watch
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
      - name: Keep the three newest store caches
        run: |
          gh cache list --key kernel-watch-store- --sort created_at --order desc --limit 100 --json id --jq '.[3:][].id' \
            | xargs -r -n1 gh cache delete
        env:
          GH_TOKEN: ${{ github.token }}
