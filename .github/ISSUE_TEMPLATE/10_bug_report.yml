name: Report a bug
description: Report a problem with Aphrody.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing [issues](https://github.com/aphrody-dev/aphrody/issues) first. For feature ideas or design feedback, open a [Discussion](https://github.com/aphrody-dev/aphrody/discussions).
  - type: dropdown
    id: component
    attributes:
      label: Component / Subsystem
      options:
        - Aphrody Studio (zed compat / core)
        - NSH (Native Shell TSX/Rust)
        - gpui-kit Components
        - WGPU / Naga Renderer
        - Vulkan / SPIR-V
        - DirectX 12 / HLSL
        - WebGPU / WGSL
        - CLI / Build / xtask
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      description: Minimal reproducible command, shader, TSX snippet, or UI steps.
      placeholder: |
        1. Run `target/debug/aphrody.exe` or `cargo run -p wgpu_cli -- ...`
        2. Observe behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Current vs. Expected behavior
      validations:
        required: true
  - type: textarea
    id: environment
    attributes:
      label: System specs & GPU backend
      placeholder: |
        OS / GPU / Vulkan or DX12 or WebGPU backend / `gpui-wgpu adapters --json`
    validations:
      required: true
