name: Report a crash
description: Aphrody application or GPU pipeline crashed or panicked.
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Launch `aphrody` / GPUI app
        2. Perform action / shader dispatch
        3. Panic or crash output
    validations:
      required: true
  - type: textarea
    attributes:
      label: Backtrace / stderr / Aphrody.log
      value: |
        ```log

        ```
    validations:
      required: true
  - type: textarea
    attributes:
      label: GPU & OS environment
      placeholder: |
        OS, GPU adapter (`gpui-wgpu adapters`), driver version
    validations:
      required: true
