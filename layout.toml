repo = "aphrody"

[repos.fw]
layer = 0
path = "../fw"
url = "https://github.com/aphrody-labs/fw"

[repos.aphrody]
layer = 1
path = "."
url = "https://github.com/aphrody-labs/aphrody"

[policy]
pinned_git = true
no_submodules = true
no_vendor = true

[cargo]
members = [
    "crates/*",
    "crates/refineable/derive_refineable",
    "extensions/glsl",
    "extensions/html",
    "extensions/proto",
    "extensions/test-extension",
    "tooling/compliance",
    "tooling/crates_io_client",
    "tooling/perf",
    "tooling/xtask",
]

