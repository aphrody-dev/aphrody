# Authoritative Aphrody Labs Ecosystem Vision, Domains & Multi-Horizon Roadmap (2026-Q4 -> 2027-Q4)
# Anchored to product.toml, DESIGN.md, and assets/os/google_design_tokens.toml.
schema_version = 1
organization = "Aphrody Labs"
design_source_of_truth = "https://design.google/"
stitch_url = "https://stitch.withgoogle.com/"
primary_monorepo = "aphrody-dev/aphrody"

[vision]
thesis = "Local-first GPU-native OS, code engine, and AI workspace where Code is a Design Material"
tagline = "120 FPS GPUI + WGPU v30 + WebAssembly Core 2.0 AOT + Sovereign AI OS"
principles = [
  "One token graph across Rust GPUI, NSH TSX, egui 0.37, Bevy 0.20, Web, iOS, and Android",
  "100% Zed ecosystem compatibility with modular zero-bloat crate boundaries",
  "WebAssembly Core 2.0 & WASI Preview 2 AOT first, native Speed without Chromium electron overhead",
  "$0 Vercel sovereign distribution via Cloudflare Workers/R2 + XFS bare-metal fleet (fr1/fr2/prd)",
  "Accessible AI-native control plane across MCP, ACP, A2A, and AccessKit UI trees",
]

[[domains]]
id = "aphrody"
org = "aphrody-dev"
repo = "aphrody-dev/aphrody"
category = "Core OS, Studio IDE & UI Framework"
surfaces = ["Desktop", "Web", "iOS", "Android", "Headless MCP"]
owner_paths = ["crates/zed", "crates/aphrody_desktop", "crates/aphrody_ui", "crates/gpui"]
summary = "Unified GPU-native Studio IDE, COSMIC Epoch desktop shell, ArtCraft 17-app suite, NSH framework, and 22-target packager."

