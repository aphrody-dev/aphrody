# Authoritative Aphrody Labs Ecosystem Vision, Domains & Multi-Horizon Roadmap (2026-Q4 -> 2027-Q4)
# Anchored to product.toml, DESIGN.md, and assets/os/google_design_tokens.toml.
schema_version = 1
organization = "Aphrody Labs"
design_source_of_truth = "https://design.google/"
stitch_url = "https://stitch.withgoogle.com/"
primary_monorepo = "aphrody-dev/aphrody"

[vision]
thesis = "Pure-Rust Desktop OS, Chromium WebGPU browser, Google Workspace & Cloud AI runtime, and multimedia studio running natively on Wayland, Windows, macOS, and WebAssembly"
tagline = "120 FPS GPUI + WGPU v30 + Material 3 Expressive (Android 17/18) + Pure-Rust Google Workspace, Cloud AI & Media"
principles = [
  "One Material 3 Expressive (Android 17/18 + Compose M3 1.5.0) token graph across GPUI, NSH TSX, egui 0.37, Bevy 0.20, Wayland, Windows, Wasm, Chromium, iOS, and Android",
  "100% Zed ecosystem compatibility with modular zero-bloat crate boundaries and zero blocking submodules",
  "Complete Google Workspace, YouTube/YouTube Music (headless agents + GPUI humans), and official Google Cloud AI (Gemini, Vertex, Imagen, Veo, Lyria, STT/TTS) in pure Rust with Kotlin/Go/Python/TS SDK parity",
  "WebAssembly Core 2.0 & WASI Preview 2 AOT first, native speed on Wayland, Windows, and Chromium WebGPU without Electron or FFmpeg overhead",
  "Accessible AI-native control plane across MCP, ACP, A2A 1.0, ADK, A2UI, and AccessKit UI trees",
]

[[domains]]
id = "aphrody"
org = "aphrody-dev"
repo = "aphrody-dev/aphrody"
category = "Pure-Rust Desktop OS, Studio IDE & Material 3 Expressive UI"
surfaces = ["Wayland", "Windows", "macOS", "Wasm/Chromium", "iOS", "Android", "Headless MCP"]
owner_paths = ["crates/zed", "crates/aphrody_desktop", "crates/aphrody_ui", "crates/gpui"]
summary = "Pure-Rust desktop shell (Wayland, Windows, Wasm/Chromium), Material 3 Expressive (Android 17/18) Liquid Glass UI, Studio IDE, Google Workspace apps, YouTube/YouTube Music, Media Studio, and 22-target packager."

