[workspace]
resolver = "2"
members = [
    "crates/*",
    "crates/refineable/derive_refineable",
    "extensions/glsl",
    "extensions/html",
    "extensions/proto",
    "extensions/test-extension",
    "tooling/compliance",
    "tooling/crates_io_client",
    "tooling/perf",
    "tooling/xtask",
]
# === APHRODY_ISOLATED_WORKSPACE_CONFIG START ===
exclude = [
    "templates/wasm-wgpu/*",
]
default-members = [
    "crates/aphrody",
    "crates/gpui_wgpu",
    "crates/gpui_web",
    "crates/gpui_ui",
    "crates/gpui_code",
    "crates/aphrody_store",
    "crates/aphrody_design",
    "crates/egui_gpui",
    "crates/bevy_gpui",
    "crates/iced_gpui",
    "crates/tauri_gpui",
    "crates/cosmic_gpui",
    "crates/aphrody_session",
    "crates/aphrody_craft",
    "crates/aphrody_installer",
    "crates/aphrody_pilot",
    "crates/aphrody_ui",
    "crates/aphrody_google",
    "crates/aphrody_media",
    "crates/aphrody_desktop",
    "crates/aphrody_cli",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
homepage = "https://aphrody.com"
readme = "README.md"
repository = "https://github.com/aphrody-labs/aphrody"
publish = false
# === APHRODY_ISOLATED_WORKSPACE_CONFIG END ===

[workspace.dependencies]

