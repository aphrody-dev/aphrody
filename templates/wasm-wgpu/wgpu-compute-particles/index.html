<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aphrody WGPU Compute Particles starter anchored to Material 3 Expressive tokens">
  <title>WGPU Compute Particles — Aphrody</title>
  <style>
    :root {
      --md-sys-color-surface: #0E141B;
      --md-sys-color-on-surface: #E0E6F0;
      --md-sys-color-primary: #8FD0FF;
      --background: var(--md-sys-color-surface);
      color-scheme: dark;
    }
    body {
      margin: 0;
      background: var(--background);
      color: var(--md-sys-color-on-surface);
      font-family: "Google Sans Flex", system-ui, sans-serif;
    }
    :focus-visible {
      outline: 2px solid var(--md-sys-color-primary);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
    canvas {
      display: block;
      max-width: 100%;
      aspect-ratio: 16 / 9;
    }
  </style>
</head>
<body>
  <main data-slot="wgpu-viewport" data-stitch-id="wgpu-compute-particles">
    <canvas width="1280" height="720" aria-label="WGPU Compute Particles Canvas"></canvas>
    <button type="button" data-slot="action-run">Validate Shader</button>
  </main>
</body>
</html>
