<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NSH Reactive WebGPU Shader starter with Material 3 Expressive springs">
  <title>NSH Reactive WebGPU Shader — Aphrody</title>
  <style>
    :root {
      --md-sys-color-surface: #0E141B;
      --md-sys-color-on-surface: #E0E6F0;
      --md-sys-color-primary: #8FD0FF;
      --background: var(--md-sys-color-surface);
    }
    body {
      margin: 0;
      background: var(--background);
      color: var(--md-sys-color-on-surface);
      font-family: "Google Sans Flex", system-ui, sans-serif;
    }
    :focus-visible { outline: 2px solid var(--md-sys-color-primary); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
    canvas { display: block; max-width: 100%; aspect-ratio: 16 / 9; }
  </style>
</head>
<body>
  <main data-slot="nsh-shader-root" data-stitch-id="nsh-webgpu-shader">
    <canvas width="1280" height="720" aria-label="NSH Reactive WebGPU Shader Viewport"></canvas>
  </main>
</body>
</html>
