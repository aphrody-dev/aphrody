[package]
name = "msvc_spectre_libs"
version = "0.1.3"
edition = "2021"
publish = false
build = "build.rs"
description = "Graceful MSVC Spectre library search path resolver that does not panic when Spectre-mitigated CRT components are not installed."
license = "MIT OR Apache-2.0"

[features]
error = []

[lib]
name = "msvc_spectre_libs"
path = "src/msvc_spectre_libs.rs"

[target.'cfg(all(target_os = "windows", target_env = "msvc"))'.build-dependencies]
cc = "1.0"
