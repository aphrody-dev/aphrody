# ------------------------------------------------------------------------------------------------ Android common kernel (Gitiles)

[[source]]
id = "android-mainline-version"
kernel = "android"
adapter = "text-version"
kind = "gitiles"
url = "https://android.googlesource.com/kernel/common/+/refs/heads/android-mainline/Makefile?format=TEXT"
decode = "base64"
patterns = ['^VERSION[ \t]*=[ \t]*(\d+)', '^PATCHLEVEL[ \t]*=[ \t]*(\d+)', '^SUBLEVEL[ \t]*=[ \t]*(\d+)', '^EXTRAVERSION[ \t]*=[ \t]*(\S*)']
template = "{1}.{2}.{3}{4}"
channel = "android-mainline"
yields = ["version"]
min_interval = "30m"
note = "Gitiles serves files base64 encoded with format=TEXT; the version comes from the Makefile header"

[[source]]
id = "android-gki-version"
kernel = "android"
adapter = "gitiles-newest-branch"
kind = "gitiles"
url = "https://android.googlesource.com/kernel/common/+refs/heads?format=JSON"
branch_pattern = '^android\d+-(\d+\.\d+)$'
file_url = "https://android.googlesource.com/kernel/common/+/refs/heads/{branch}/Makefile?format=TEXT"
channel = "gki"
yields = ["version"]
min_interval = "6h"
note = "discovers the newest androidNN-X.Y branch from the 68 KB branch list; +refs without /heads is 72 MB and is never used"

[[source]]
id = "android-mainline-log"
kernel = "android"
adapter = "gitiles-log"
kind = "gitiles"
url = "https://android.googlesource.com/kernel/common/+log/refs/heads/android-mainline?format=JSON&n=50"
web = "https://android.googlesource.com/kernel/common"
yields = ["commit"]
min_interval = "30m"

# ------------------------------------------------------------------------------------------------ ChromiumOS (Gitiles)

[[source]]
id = "chromiumos-newest-branch"
kernel = "chromiumos"
adapter = "gitiles-newest-branch"
kind = "gitiles"
url = "https://chromium.googlesource.com/chromiumos/third_party/kernel/+refs/heads?format=JSON"
branch_pattern = '^chromeos-(\d+\.\d+)$'
file_url = "https://chromium.googlesource.com/chromiumos/third_party/kernel/+/refs/heads/{branch}/Makefile?format=TEXT"
channel = "newest-branch"
yields = ["version"]
min_interval = "12h"
note = "branch list is 1.5 MB, hence the interval; there is no main branch (404), versions live on chromeos-X.Y branches"

[[source]]
