# Kernel watch manifest: every source, host, organisation and satellite site the watch follows.
# Each URL was requested live on 2026-11-17 and answered 200; fixtures/verified.json records status and shape per source
# (regenerate with `bun cli.ts verify`). Nothing else in the tool names a host.

[watch]
user_agent = "kernel-watch"
min_interval = "10m"
timeout = "30s"
max_pages = 3                 # pages followed per poll, and only while a whole page was new
concurrency_per_host = 2
retention_days = 45           # high-volume items (commits, mail, pages, packages) older than this are dropped
max_backoff = "6h"

# Tokens are read from the environment when present; without one the public rate limits apply.
[watch.auth."api.github.com"]
scheme = "Bearer"
env = ["GITHUB_TOKEN", "GH_TOKEN"]

