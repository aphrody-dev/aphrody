[[source]]
id = "fedora-ark-commits"
kernel = "fedora"
adapter = "gitlab-commits"
kind = "forge-api"
url = "https://gitlab.com/api/v4/projects/cki-project%2Fkernel-ark/repository/commits?per_page=50"
yields = ["commit"]
min_interval = "30m"

[[source]]
id = "fedora-ark-merge-requests"
kernel = "fedora"
adapter = "gitlab-merge-requests"
kind = "forge-api"
url = "https://gitlab.com/api/v4/projects/cki-project%2Fkernel-ark/merge_requests?state=all&order_by=updated_at&per_page=50"
yields = ["pr"]
min_interval = "30m"

# ------------------------------------------------------------------------------------------------ Ubuntu

[[source]]
id = "ubuntu-launchpad"
kernel = "ubuntu"
adapter = "launchpad-sources"
kind = "package-index"
url = "https://api.launchpad.net/devel/ubuntu/+archive/primary?ws.op=getPublishedSources&source_name=linux&exact_match=true&order_by_date=true&ws.size=30"
yields = ["package", "version"]
min_interval = "30m"

[[source]]
id = "ubuntu-mainline-builds"
kernel = "ubuntu"
adapter = "html-index-versions"
kind = "html-index"
url = "https://kernel.ubuntu.com/mainline/"
limit = 8
channel = "mainline-ppa"
yields = ["build", "version"]
min_interval = "1h"

# ------------------------------------------------------------------------------------------------ Arch Linux

[[source]]
id = "arch-linux"
kernel = "arch"
adapter = "json-version"
kind = "package-index"
url = "https://archlinux.org/packages/core/x86_64/linux/json/"
path = "pkgver"
time_path = "last_update"
channel = "core/linux"
yields = ["version"]
min_interval = "30m"
note = "Core-Testing holds no linux package at the moment (search answers 200 with zero results), so Arch's rc is the AUR package below"

[[source]]
id = "arch-linux-lts"
kernel = "arch"
adapter = "json-version"
kind = "package-index"
url = "https://archlinux.org/packages/core/x86_64/linux-lts/json/"
path = "pkgver"
time_path = "last_update"
channel = "core/linux-lts"
yields = ["version"]
min_interval = "30m"

[[source]]
id = "arch-linux-zen"
kernel = "arch"
adapter = "json-version"
kind = "package-index"
url = "https://archlinux.org/packages/extra/x86_64/linux-zen/json/"
path = "pkgver"
time_path = "last_update"
channel = "extra/linux-zen"
yields = ["version"]
min_interval = "30m"

[[source]]
id = "arch-aur-mainline"
kernel = "arch"
adapter = "json-version"
kind = "package-index"
url = "https://aur.archlinux.org/rpc/v5/info?arg[]=linux-mainline"
path = "results.0.Version"
time_path = "results.0.LastModified"
channel = "aur/linux-mainline"
yields = ["version"]
min_interval = "30m"

[[source]]
id = "arch-packaging-tags"
kernel = "arch"
adapter = "gitlab-tags"
kind = "forge-api"
url = "https://gitlab.archlinux.org/api/v4/projects/archlinux%2Fpackaging%2Fpackages%2Flinux/repository/tags?per_page=30"
web = "https://gitlab.archlinux.org/archlinux/packaging/packages/linux/-/tags"
yields = ["tag"]
min_interval = "1h"

# ------------------------------------------------------------------------------------------------ CachyOS

[[source]]
id = "cachyos-stable-version"
kernel = "cachyos"
adapter = "text-version"
kind = "package-index"
url = "https://raw.githubusercontent.com/CachyOS/linux-cachyos/master/linux-cachyos/.SRCINFO"
patterns = ['^\s*pkgver = (\S+)']
channel = "linux-cachyos"
yields = ["version"]
min_interval = "15m"

[[source]]
id = "cachyos-rc-version"
kernel = "cachyos"
adapter = "text-version"
kind = "package-index"
url = "https://raw.githubusercontent.com/CachyOS/linux-cachyos/master/linux-cachyos-rc/.SRCINFO"
patterns = ['^\s*pkgver = (\S+)']
channel = "linux-cachyos-rc"
yields = ["version"]
min_interval = "15m"

[[source]]
id = "cachyos-commits"
kernel = "cachyos"
adapter = "github-commits"
kind = "forge-api"
url = "https://api.github.com/repos/CachyOS/linux-cachyos/commits?per_page=50"
yields = ["commit"]
min_interval = "15m"

[[source]]
id = "cachyos-kernel-releases"
kernel = "cachyos"
adapter = "github-releases"
kind = "forge-api"
url = "https://api.github.com/repos/CachyOS/linux/releases?per_page=30"
yields = ["release"]
min_interval = "30m"

[[source]]
id = "cachyos-org-repos"
kernel = "cachyos"
adapter = "github-org-repos"
kind = "forge-api"
url = "https://api.github.com/orgs/CachyOS/repos?per_page=100&sort=pushed"
yields = ["repo"]
min_interval = "6h"

# ------------------------------------------------------------------------------------------------ RHEL / CentOS Stream

[[source]]
id = "rhel-c10s-commits"
kernel = "rhel"
adapter = "gitlab-commits"
kind = "forge-api"
url = "https://gitlab.com/api/v4/projects/redhat%2Fcentos-stream%2Fsrc%2Fkernel%2Fcentos-stream-10/repository/commits?per_page=30"
version_from = '^\[redhat\] kernel-(\d+\.\d+\.\d+)-\d+'
channel = "centos-stream-10"
yields = ["commit", "version"]
min_interval = "1h"
note = "RHEL builds are published as source-git commits titled '[redhat] kernel-<base>-<build>'; the base kernel is the version"

[[source]]
id = "rhel-c9s-commits"
kernel = "rhel"
adapter = "gitlab-commits"
kind = "forge-api"
url = "https://gitlab.com/api/v4/projects/redhat%2Fcentos-stream%2Fsrc%2Fkernel%2Fcentos-stream-9/repository/commits?per_page=30"
version_from = '^\[redhat\] kernel-(\d+\.\d+\.\d+)-\d+'
channel = "centos-stream-9"
yields = ["commit", "version"]
min_interval = "1h"

