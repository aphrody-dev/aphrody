# Four real entries, recorded 2026-11-17 into forks-api.json (bun tools/forks.ts --manifest tools/fixtures/forks.fixture.toml --record tools/fixtures/forks-api.json).
[meta]
org = "aphrody-labs"

[groups]
compiler = "compiler"
devtools = "devtools"
std = "std"

[[fork]]
path = "compiler/rust"
name = "rust"
upstream = "rust-lang/rust"
branch = "main"
role = "compiler"

[[fork]]
path = "compiler/rust-lang-llvm-project"
name = "rust-lang-llvm-project"
upstream = "rust-lang/llvm-project"
branch = "rustc/23.1-2026-07-22"
default_branch = "landing-page"
role = "backend"

[[fork]]
path = "devtools/cargo"
name = "cargo"
upstream = "rust-lang/cargo"
branch = "master"
role = "package-manager"

[[fork]]
path = "std/libc"
name = "libc"
upstream = "rust-lang/libc"
branch = "main"
role = "std"
