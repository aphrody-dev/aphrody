[project]
name = "open-replica"
version = "0.1.0"
description = "Python side of the replica workflow: crawl, conversion, retrieval, visual parity and binary analysis, assembled from upstream libraries"
requires-python = ">=3.11"
dependencies = [
  # crawl and scrape: deep crawl, rendered HTML, Markdown and screenshots per page
  "crawl4ai",
  # documents to Markdown; docling for layout-heavy documents (PDF), markitdown for the rest
  "markitdown[all]",
  "docling",
  # content type of every download, from its bytes
  "magika",
  # retrieval over the recon corpus with local embeddings
  "llama-index-core",
  "llama-index-embeddings-huggingface",
  "sentence-transformers",
  # PyTorch: installed with `uv pip install --torch-backend auto` so the CUDA build is chosen when a driver answers
  "torch",
  # TensorFlow: the workflow adds the `and-cuda` extra on Linux with an NVIDIA driver
  "tensorflow",
  # visual parity diagnostics (obscura's check.py)
  "numpy",
  "pillow",
  "scipy",
  # binary analysis
  "lief",
  "pyghidra",
]

[project.scripts]
open-replica = "open_replica.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["open_replica"]
