[package]
name = "os_desktop"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
description = "COSMIC Epoch desktop shell, compositor canvas, and unified ArtCraft + Craft Anything studio binary (aphrody-os) built natively on GPUI."

[lints]
workspace = true

[lib]
path = "src/os_desktop.rs"
doctest = false

[[bin]]
name = "aphrody-os"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["gpui_ui/desktop"]
shell-module = ["dep:gpui_app_shell"]

[dependencies]
anyhow.workspace = true
assets.workspace = true
brand.workspace = true
clap.workspace = true
chrono.workspace = true
env_logger.workspace = true
gpui.workspace = true
gpui_app_shell = { workspace = true, optional = true }
gpui_platform.workspace = true
gpui_ui.workspace = true
icons.workspace = true
log.workspace = true
os_craft.workspace = true
os_session.workspace = true
os_ui.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
theme.workspace = true
ui.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
gpui_wgpu = { workspace = true, features = ["test-support"] }
image.workspace = true
tempfile.workspace = true
