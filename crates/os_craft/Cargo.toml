[package]
name = "os_craft"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
description = "Declarative ArtCraft studio catalog, full storytold/craft-libs & craft-anything format/codec/JS pipeline, and unified OS MCP control server."

[lints]
workspace = true

[lib]
path = "src/os_craft.rs"
doctest = false

[features]
default = ["codecs", "storytold-suite", "wasm-inspect", "native-inspect"]
full = ["codecs", "storytold-suite", "wasm-inspect", "native-inspect"]
codecs = [
    "dep:craft-exr",
    "craft-exr/decode",
    "dep:craft-plist",
    "dep:craft-psd",
    "dep:image",
    "dep:resvg",
    "dep:usvg",
]
storytold-suite = [
    "dep:craft-anicraft-format",
    "dep:craft-anything-analysis",
    "dep:craft-anything-disasm",
    "dep:craft-anything-evidence",
    "dep:craft-anything-formats",
    "dep:craft-anything-js",
    "dep:craft-color",
    "dep:craft-csv",
    "dep:craft-dds",
    "dep:craft-deckcraft-format",
    "dep:craft-docx",
    "dep:craft-dxf",
    "dep:craft-ecproj-format",
    "dep:craft-elf",
    "dep:craft-fcproj-format",
    "dep:craft-fig",
    "dep:craft-figcraft-format",
    "dep:craft-figma-rest",
    "dep:craft-gcode",
    "dep:craft-gridcraft-format",
    "dep:craft-hdr",
    "dep:craft-i18n",
    "dep:craft-kiwi",
    "dep:craft-kra",
    "dep:craft-lottie",
    "dep:craft-macho",
    "dep:craft-materialx",
    "dep:craft-math",
    "dep:craft-mcmat",
    "dep:craft-mesh",
    "dep:craft-midi",
    "dep:craft-ora",
    "dep:craft-pcraft-format",
    "dep:craft-pe",
    "dep:craft-penpot",
    "dep:craft-pptx",
    "dep:craft-sf2",
    "dep:craft-sheet",
    "dep:craft-sketch",
    "dep:craft-tar",
    "dep:craft-tcraft",
    "dep:craft-tga",
    "dep:craft-timeline",
    "dep:craft-usd",
    "dep:craft-vectorcraft-format",
    "dep:craft-wordmodel",
    "dep:craft-xcf",
    "dep:craft-xlsx",
    "dep:craft-xml",
    "dep:craft-zip",
]
wasm-inspect = ["dep:wasmparser"]
native-inspect = ["dep:object"]

[dependencies]
anyhow.workspace = true
brand.workspace = true
craft-anicraft-format = { workspace = true, optional = true }
craft-anything-analysis = { workspace = true, optional = true }
craft-anything-disasm = { workspace = true, optional = true }
craft-anything-evidence = { workspace = true, optional = true }
craft-anything-formats = { workspace = true, optional = true }
craft-anything-js = { workspace = true, optional = true }
craft-color = { workspace = true, optional = true }
craft-csv = { workspace = true, optional = true }
craft-dds = { workspace = true, optional = true }
craft-deckcraft-format = { workspace = true, optional = true }
craft-docx = { workspace = true, optional = true }
craft-dxf = { workspace = true, optional = true }
craft-ecproj-format = { workspace = true, optional = true }
craft-elf = { workspace = true, optional = true, features = ["serde"] }
craft-exr = { workspace = true, optional = true }
craft-fcproj-format = { workspace = true, optional = true }
craft-fig = { workspace = true, optional = true }
craft-figcraft-format = { workspace = true, optional = true }
craft-figma-rest = { workspace = true, optional = true }
craft-gcode = { workspace = true, optional = true }
craft-gridcraft-format = { workspace = true, optional = true }
craft-hdr = { workspace = true, optional = true }
craft-i18n = { workspace = true, optional = true }
craft-kiwi = { workspace = true, optional = true }
craft-kra = { workspace = true, optional = true }
craft-lottie = { workspace = true, optional = true }
craft-macho = { workspace = true, optional = true, features = ["serde"] }
craft-materialx = { workspace = true, optional = true }
craft-math = { workspace = true, optional = true }
craft-mcmat = { workspace = true, optional = true }
craft-mesh = { workspace = true, optional = true }
craft-midi = { workspace = true, optional = true }
craft-ora = { workspace = true, optional = true }
craft-pcraft-format = { workspace = true, optional = true }
craft-pe = { workspace = true, optional = true, features = ["serde"] }
craft-penpot = { workspace = true, optional = true }
craft-plist = { workspace = true, optional = true }
craft-pptx = { workspace = true, optional = true }
craft-psd = { workspace = true, optional = true }
craft-sf2 = { workspace = true, optional = true }
craft-sheet = { workspace = true, optional = true }
craft-sketch = { workspace = true, optional = true }
craft-sniff.workspace = true
craft-tar = { workspace = true, optional = true }
craft-tcraft = { workspace = true, optional = true }
craft-tga = { workspace = true, optional = true }
craft-timeline = { workspace = true, optional = true }
craft-usd = { workspace = true, optional = true }
craft-vectorcraft-format = { workspace = true, optional = true }
craft-wordmodel = { workspace = true, optional = true }
craft-xcf = { workspace = true, optional = true }
craft-xlsx = { workspace = true, optional = true }
craft-xml = { workspace = true, optional = true }
craft-zip = { workspace = true, optional = true }
dirs.workspace = true
image = { workspace = true, optional = true }
log.workspace = true
object = { workspace = true, optional = true }
os_pilot.workspace = true
os_session.workspace = true
resvg = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
usvg = { workspace = true, optional = true }
wasmparser = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
