[package]
name = "aphrody_cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/aphrody_cli.rs"
doctest = false

[[bin]]
name = "gpui-wgpu"
path = "src/main.rs"

[[bin]]
name = "aphrody-cli"
path = "src/aphrody_cli_bin.rs"

[dependencies]
anyhow.workspace = true
aphrody = { workspace = true, features = ["minimal", "craft", "pilot", "store", "installer", "cosmic"] }
aphrody_craft.workspace = true
aphrody_design.workspace = true
aphrody_installer.workspace = true
aphrody_pilot.workspace = true
aphrody_session.workspace = true
aphrody_store.workspace = true
brand.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
clap = { workspace = true, features = ["derive"] }
cosmic_gpui.workspace = true
flate2.workspace = true
image.workspace = true
naga = { workspace = true, features = ["wgsl-in", "wgsl-out", "glsl-out", "hlsl-out", "msl-out", "spv-out"] }
pollster.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
wasm-encoder.workspace = true
wasmparser.workspace = true
wgpu = { workspace = true, features = ["std", "wgsl", "dx12", "metal", "vulkan", "gles"] }

[dev-dependencies]
tempfile.workspace = true
