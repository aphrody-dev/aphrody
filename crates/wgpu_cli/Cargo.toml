[package]
name = "wgpu_cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[[bin]]
name = "gpui-wgpu"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
clap = { workspace = true, features = ["derive"] }
image.workspace = true
naga = { workspace = true, features = ["wgsl-in", "wgsl-out", "glsl-out", "hlsl-out", "msl-out", "spv-out"] }
pollster.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
wgpu = { workspace = true, features = ["std", "wgsl", "dx12", "metal", "vulkan", "gles"] }
