[package]
description = "Ultra-fast, modular GPU-native code and UI studio, 100% compatible with the Zed ecosystem."
edition.workspace = true
name = "zed"
version = "1.31.0"
publish.workspace = true
license = "GPL-3.0-or-later"
authors = ["Aphrody Labs <dev@aphrody.com>"]
default-run = "aphrody"

[lints]
workspace = true

[features]
default = ["aphrody"]
# Consolidated Aphrody fork feature uniting NSH TSX Studio, Material 3 Compose 1.5.0 &
# Parametric Studio, Design/Stitch/FigCraft/Craft/Bevy Hub, and AI OS Pilot / Headless MCP.
aphrody = [
    "nsh",
    "studio",
    "pilot",
]
pilot = [
    "dep:aphrody_pilot",
]
extensions = [
    "dep:extension_host",
    "dep:extensions_ui",
    "dep:language_extension",
    "dep:theme_extension",
    "activity_indicator/extensions",
    "language/wasm-grammars",
    "recent_projects/extensions",
]
debugger = [
    "dep:dap_adapters",
    "dep:debug_adapter_extension",
    "dep:debugger_tools",
    "dep:debugger_ui",
]
repl = [
    "dep:repl",
]
collab = [
    "dep:audio",
    "dep:call",
    "dep:collab_ui",
    "agent_ui?/audio",
    "git_ui/call",
    "title_bar/collab",
    "gpui_platform/screen-capture",
]
ai = [
    "dep:acp_thread",
    "dep:acp_tools",
    "dep:agent",
    "dep:agent-client-protocol",
    "dep:agent_skills",
    "dep:agent_ui",
    "dep:codestral",
    "dep:copilot",
    "dep:copilot_chat",
    "dep:copilot_ui",
    "dep:edit_prediction",
    "dep:edit_prediction_ui",
    "dep:language_models",
    "dep:prompt_store",
    "dep:settings_ui",
    "dep:sidebar",
    "dep:web_search",
    "dep:web_search_providers",
    "language_tools/edit-prediction",
]
updater = [
    "dep:auto_update",
    "dep:auto_update_ui",
    "dep:feedback",
]
crash-reporting = [
    "dep:crashes",
    "dep:hang_telemetry",
]
nsh = [
    "dep:aphrody_nsh",
]
studio = [
    "nsh",
    "aphrody_nsh/studio",
]
grammars = [
    "languages/load-grammars",
]
full = [
    "aphrody",
    "extensions",
    "debugger",
    "repl",
    "collab",
    "ai",
    "updater",
    "crash-reporting",
    "grammars",
]
tracy = ["ztracing/tracy"]
# LEAK_BACKTRACE=1 cargo run --features zed/track-project-leak --profile release-fast
track-project-leak = ["gpui/leak-detection"]
test-support = [
    "full",
    "gpui/test-support",
    "gpui_platform/screen-capture",
    "dep:image",
    "workspace/test-support",
    "project/test-support",
    "editor/test-support",
    "terminal_view/test-support",
    "image_viewer/test-support",
    "recent_projects/test-support",
    "repl/test-support",
    "title_bar/test-support",
]
visual-tests = [
    "full",
    "gpui/test-support",
    "gpui_platform/screen-capture",
    "gpui_platform/test-support",
    "dep:image",
    "dep:tempfile",
    "dep:action_log",
    "dep:agent_servers",
    "dep:env_logger",
    "workspace/test-support",
    "project/test-support",
    "editor/test-support",
    "terminal_view/test-support",
    "image_viewer/test-support",
    "clock/test-support",
    "acp_thread/test-support",
    "action_log/test-support",
    "agent_ui/test-support",
    "db/test-support",
    "agent/test-support",
    "language_model/test-support",
    "fs/test-support",
    "recent_projects/test-support",
    "title_bar/test-support",
]

[[bin]]
name = "aphrody"
path = "src/main.rs"

[[bin]]
name = "zed-visual-test-runner"
path = "src/visual_test_runner.rs"
required-features = ["visual-tests"]

