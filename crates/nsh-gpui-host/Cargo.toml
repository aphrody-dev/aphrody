[package]
name = "nsh-gpui-host"
description = "Development host app (GPUI) that runs a nsh bundle on macOS, Windows and Linux."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Compile GPUI's Metal shaders at run time: builds on macOS without a Metal Toolchain.
runtime-shaders = ["nsh-platform-gpui/runtime-shaders"]
shot = ["nsh-platform-gpui/shot"]

[dependencies]
log.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
nsh-base.workspace = true
nsh-platform-gpui = { workspace = true, features = ["dev", "webview"] }
nsh-dev.workspace = true
nsh-engine = { workspace = true, features = ["js"] }

# Videos play through GStreamer, which Linux desktops have.
[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-gpui = { workspace = true, features = ["dev", "webview", "video"] }
