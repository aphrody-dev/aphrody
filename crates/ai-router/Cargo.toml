[package]
name = "ay-open-ai-router"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Multi-provider AI router: models discovered at run time (models.dev catalog, local servers), local first then zero-cost then cheapest offers, failover across offers, OpenAI-compatible service, CLI and C ABI"
publish = false

[lib]
name = "ai_router"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "ai-router"
path = "src/main.rs"

[dependencies]
ay-open-c-abi.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tiny_http = "0.12.0"
ureq = { version = "3.5.2", features = ["json"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
