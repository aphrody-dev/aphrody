[package]
name = "aphrody_av"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0 OR GPL-3.0-or-later"
description = "Pure-Rust FFmpeg replacement: probe, decode, encode, remux, transcode and convert for any agent, library, language or OS (Rust API, CLI, C ABI, UniFFI, wasm, MCP)."

[lints]
workspace = true

[lib]
path = "src/aphrody_av.rs"
crate-type = ["rlib", "cdylib"]
doctest = false

[[bin]]
name = "aphrody-av"
path = "src/bin/aphrody-av.rs"
required-features = ["cli"]
doctest = false

[[bin]]
name = "aphrody-av-uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi-cli"]

[[bin]]
name = "aphrody-av-header"
path = "src/bin/header.rs"
required-features = ["header"]

[features]
default = ["cli", "ffi", "threads"]
cli = ["mcp"]
mcp = ["dep:rmcp", "dep:tokio"]
ffi = []
threads = ["craft-video/threads"]
uniffi = ["dep:uniffi"]
uniffi-cli = ["uniffi", "uniffi/cli"]
wasm = ["dep:wasm-bindgen"]
header = ["dep:cbindgen"]

[dependencies]
craft-audio = { workspace = true, features = ["decode", "encode", "flac-decode", "vorbis-decode"] }
craft-media = { workspace = true, features = ["isobmff", "matroska", "avi", "mxf", "mpegts", "ogg"] }
craft-video = { workspace = true, features = ["h264", "hevc", "vp9", "av1", "vp8", "mpeg2", "mpeg4", "ffv1", "mjpeg", "prores", "dnx", "apv"] }
fw-video.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

rmcp = { version = "3.11.0", optional = true, default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { workspace = true, optional = true, features = ["rt", "macros", "io-std", "io-util"] }
uniffi = { version = "0.32.2", optional = true }
cbindgen = { version = "0.29.4", optional = true, default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.130", optional = true }

[dev-dependencies]
tempfile.workspace = true
