language = "C"
header = "/* Generated by `cargo run -p aphrody_av --features header --bin aphrody-av-header`. Do not edit. */"
include_guard = "APHRODY_AV_H"
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
documentation = true
documentation_style = "c99"
usize_is_size_t = true
cpp_compat = true

[parse]
parse_deps = false
include = []

[parse.expand]
crates = []

[export]
item_types = ["functions", "opaque"]
exclude = ["Codec", "Format", "ConvertFormat"]

