[package]
name = "aphrody_desktop"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
description = "COSMIC Epoch desktop shell, compositor canvas, and unified ArtCraft + Craft Anything studio binary (aphrody-os) built natively on GPUI."

[lints]
workspace = true

[lib]
path = "src/aphrody_desktop.rs"
doctest = false

[[bin]]
name = "aphrody-os"
path = "src/main.rs"
required-features = ["cli"]

[[example]]
name = "web_os"
path = "examples/web_os.rs"

[features]
default = ["desktop", "cli"]
desktop = ["gpui_ui/desktop"]
web = []
mobile = []
cli = ["dep:clap", "dep:env_logger"]
shell-module = ["dep:gpui_app_shell"]
vpn = ["shell-module", "dep:aphrody_vpn"]

[dependencies]
anyhow.workspace = true
assets.workspace = true
brand.workspace = true
clap = { workspace = true, optional = true }
chrono.workspace = true
env_logger = { workspace = true, optional = true }
gpui.workspace = true
gpui_app_shell = { workspace = true, optional = true }
gpui_platform.workspace = true
gpui_ui.workspace = true
icons.workspace = true
log.workspace = true
aphrody_craft.workspace = true
aphrody_browser.workspace = true
aphrody_installer.workspace = true
aphrody_pilot.workspace = true
aphrody_session.workspace = true
aphrody_store = { workspace = true, default-features = false }
aphrody_ui.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
theme.workspace = true
ui.workspace = true
aphrody_vpn = { workspace = true, optional = true }
web-time.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
gpui_wgpu = { workspace = true, features = ["test-support"] }
image.workspace = true
tempfile.workspace = true
