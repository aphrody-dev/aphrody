[package]
name = "craft_studio"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
description = "Unified Google Design + Stitch Studio core for FigCraft, Craft Anything, Bevy Unreal 5.8, and the 18 Storytold Craft Apps with dual side-by-side GPUI vs egui 0.37 parity."

[lints]
workspace = true

[lib]
path = "src/craft_studio.rs"
doctest = false

[[example]]
name = "studio_parity_report"
path = "examples/studio_parity_report.rs"

[features]
default = ["figcraft", "craft-anything", "unreal-bevy"]
figcraft = []
craft-anything = []
unreal-bevy = []
wgpu = ["bevy_gpui/wgpu", "egui_gpui/wgpu"]

[dependencies]
anyhow.workspace = true
bevy_gpui.workspace = true
craft-anything-disasm.workspace = true
craft-anything-evidence.workspace = true
craft-anything-js.workspace = true
craft-elf = { workspace = true, features = ["serde"] }
craft-fig.workspace = true
craft-figcraft-format.workspace = true
craft-figma-rest.workspace = true
craft-macho = { workspace = true, features = ["serde"] }
craft-materialx.workspace = true
craft-pe = { workspace = true, features = ["serde"] }
craft-penpot.workspace = true
craft-sketch.workspace = true
egui_gpui.workspace = true
google_design_stitch.workspace = true
gpui.workspace = true
kurbo.workspace = true
os_craft.workspace = true
os_ui.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ui.workspace = true
web-time.workspace = true
