[package]
name = "nsh_workspace"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
description = "Unified Native Shell (nsh) Workspace integration for gpui_app_shell and zed: live TSX hot-reload preview, embedded GpuiCodeEditor native component, Google Design/Stitch, and Storytold Craft Studio."

[lints]
workspace = true

[lib]
path = "src/nsh_workspace.rs"
doctest = false

[features]
default = ["studio"]
design-stitch = ["dep:google_design_stitch"]
craft-studio = ["design-stitch", "dep:craft_studio"]
studio = ["design-stitch", "craft-studio"]
webview = ["gpui_ui/nsh-webview"]

[dependencies]
anyhow.workspace = true
brand.workspace = true
craft_studio = { workspace = true, optional = true }
editor.workspace = true
file_icons.workspace = true
google_design_stitch = { workspace = true, optional = true }
gpui_ui = { workspace = true, features = ["nsh-dev", "nsh-shader", "nsh-math", "nsh-tui"] }
language.workspace = true
log.workspace = true
os_ui.workspace = true
serde_json.workspace = true
util.workspace = true
workspace.workspace = true
