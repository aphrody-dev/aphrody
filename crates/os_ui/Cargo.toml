[package]
name = "os_ui"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"
description = "Unified GPUI OS toolkit combining Iced-style reactive programs, Egui-style immediate inspectors/charts, and Libcosmic theme/config/nav abstractions with WCAG AA verification."

[lints]
workspace = true

[lib]
path = "src/os_ui.rs"
doctest = false

[features]
default = []
test-support = ["gpui/test-support", "theme/test-support"]

[dependencies]
anyhow.workspace = true
brand.workspace = true
dirs.workspace = true
gpui.workspace = true
icons.workspace = true
log.workspace = true
os_session.workspace = true
palette.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
syntax_theme.workspace = true
theme.workspace = true
thiserror.workspace = true
toml.workspace = true
ui.workspace = true
